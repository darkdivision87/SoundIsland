# XcodeGen spec. Generate the Xcode project with:  xcodegen generate
name: SoundIsland
options:
  bundleIdPrefix: com.darkdivision87
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "2"        # iPad only
    DEVELOPMENT_TEAM: ""               # set your team ID in Xcode
packages:
  SoundIslandKit:
    path: Packages/SoundIslandKit
targets:
  SoundIsland:
    type: application
    platform: iOS
    sources:
      - path: App
    resources:
      - path: App/Resources
    dependencies:
      - package: SoundIslandKit
        product: MusicTheory
      - package: SoundIslandKit
        product: AudioCore
      - package: SoundIslandKit
        product: GameKitCore
      - package: SoundIslandKit
        product: Curriculum
      - package: SoundIslandKit
        product: StudioModel
      - package: SoundIslandKit
        product: DesignSystem
      - package: SoundIslandKit
        product: ProfileStore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Sound Island
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes: []
        LSApplicationCategoryType: public.app-category.education
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.darkdivision87.soundisland
        INFOPLIST_KEY_UIStatusBarHidden: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - package: SoundIslandKit/SoundIslandKitTests
