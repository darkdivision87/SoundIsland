<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>World Map</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5A3FD9}a:hover{color:#2A2550}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 1194px; height: 834px; position: relative; overflow: hidden; background: {{ocean}}; font-family: 'Nunito', ui-rounded, system-ui, sans-serif; color: #2A2550">

<svg width="1194" height="834" viewBox="0 0 1194 834" aria-hidden="true" style="position: absolute; left: 0; top: 0">
<g fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.45">
<path d="M70 170 q18 -14 36 0 t36 0"/>
<path d="M520 120 q18 -14 36 0 t36 0"/>
<path d="M1010 600 q18 -14 36 0 t36 0"/>
<path d="M330 640 q18 -14 36 0 t36 0"/>
<path d="M780 680 q18 -14 36 0 t36 0"/>
<path d="M880 120 q18 -14 36 0 t36 0"/>
</g>
<path d="M135 530 C200 410 260 330 325 270 S 470 480 525 520 S 660 270 715 250 S 850 480 905 520 S 1040 270 1085 260 S 1180 490 1215 540" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-dasharray="2 18" opacity="0.9"/>
</svg>

<sc-for list="{{islands}}" as="isl" hint-placeholder-count="7">
<button aria-label="{{isl.aria}}" style="{{isl.pos}}">
<svg width="190" height="140" viewBox="0 0 220 160" aria-hidden="true">
<ellipse cx="110" cy="140" rx="94" ry="14" fill="#2A2550" opacity="0.12"/>
<ellipse cx="110" cy="112" rx="98" ry="36" fill="#F4D7A1" stroke="#2A2550" stroke-width="4"/>
<ellipse cx="110" cy="88" rx="80" ry="46" fill="{{isl.fill}}" stroke="#2A2550" stroke-width="4"/>
<g transform="translate(80 54)"><path d="{{isl.emblem}}" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>
</svg>
<span style="display: flex; flex-direction: column; align-items: center; gap: 4px; background: #FFFFFF; border: 3px solid #2A2550; border-radius: 22px; padding: 8px 16px; box-shadow: 0 5px 0 #2A2550; margin-top: -10px">
<span style="font-size: 18px; font-weight: 900; white-space: nowrap">{{isl.name}}</span>
<span style="display: flex; gap: 4px">
<sc-for list="{{isl.stars}}" as="s" hint-placeholder-count="3">
<svg width="20" height="20" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 3 L25 14 L37 15.5 L28 23.5 L30.5 35.5 L20 29.5 L9.5 35.5 L12 23.5 L3 15.5 L15 14 Z" fill="{{s.fill}}" stroke="#2A2550" stroke-width="3" stroke-linejoin="round"/></svg>
</sc-for>
</span>
</span>
<sc-if value="{{isl.locked}}" hint-placeholder-val="{{false}}">
<span style="position: absolute; top: 40px; left: 72px; width: 46px; height: 46px; border-radius: 23px; background: #FFFFFF; border: 3px solid #2A2550; display: flex; align-items: center; justify-content: center">
<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="3" fill="#2A2550"/><path d="M8 10 V7 a4 4 0 0 1 8 0 V10" fill="none" stroke="#2A2550" stroke-width="2.5"/></svg>
</span>
</sc-if>
</button>
</sc-for>

<div style="position: absolute; left: 676px; top: 48px; display: flex; align-items: flex-end; gap: 6px">
<svg width="96" height="96" viewBox="0 0 120 120" role="img" aria-label="Bop the speaker buddy">
<ellipse cx="60" cy="114" rx="36" ry="5" fill="#2A2550" opacity="0.15"/>
<line x1="60" y1="22" x2="60" y2="8" stroke="#2A2550" stroke-width="4" stroke-linecap="round"/>
<circle cx="60" cy="7" r="6" fill="#FFD447" stroke="#2A2550" stroke-width="3"/>
<rect x="12" y="24" width="96" height="86" rx="40" fill="#5A3FD9" stroke="#2A2550" stroke-width="4"/>
<rect x="12" y="18" width="96" height="84" rx="40" fill="#7B5CFF" stroke="#2A2550" stroke-width="4"/>
<circle cx="42" cy="48" r="10" fill="#FFFFFF" stroke="#2A2550" stroke-width="3"/><circle cx="44" cy="50" r="4.5" fill="#2A2550"/>
<circle cx="78" cy="48" r="10" fill="#FFFFFF" stroke="#2A2550" stroke-width="3"/><circle cx="80" cy="50" r="4.5" fill="#2A2550"/>
<circle cx="27" cy="66" r="6" fill="#FF8FB1" opacity="0.85"/><circle cx="93" cy="66" r="6" fill="#FF8FB1" opacity="0.85"/>
<circle cx="60" cy="78" r="16" fill="#2A2550"/><circle cx="60" cy="78" r="10" fill="#4B3FA0"/><circle cx="60" cy="78" r="4" fill="#A99BFF"/>
</svg>
<div style="background: #FFFFFF; border: 3px solid #2A2550; border-radius: 22px 22px 22px 6px; padding: 10px 16px; font-size: 20px; font-weight: 800; margin-bottom: 52px; box-shadow: 0 5px 0 #2A2550">Let's cook some chords!</div>
</div>

<div style="position: absolute; left: 32px; right: 32px; top: 24px; display: flex; align-items: center; justify-content: space-between">
<button aria-label="Switch player: Maya the fox" style="width: 76px; height: 76px; border-radius: 38px; background: #FFFFFF; border: 4px solid #2A2550; box-shadow: 0 6px 0 #2A2550; display: flex; align-items: center; justify-content: center; padding: 0">
<svg width="52" height="52" viewBox="0 0 60 60" aria-hidden="true"><path d="M10 12 L22 22 L38 22 L50 12 L48 34 C46 46 38 52 30 52 C22 52 14 46 12 34 Z" fill="#FF9A3C" stroke="#2A2550" stroke-width="3.5" stroke-linejoin="round"/><path d="M20 38 C24 44 36 44 40 38 C36 50 24 50 20 38 Z" fill="#FFFFFF"/><circle cx="23" cy="32" r="3.5" fill="#2A2550"/><circle cx="37" cy="32" r="3.5" fill="#2A2550"/><circle cx="30" cy="41" r="3" fill="#2A2550"/></svg>
</button>
<div style="background: #FFFFFF; border: 4px solid #2A2550; border-radius: 30px; padding: 8px 28px; box-shadow: 0 6px 0 #2A2550; font-size: 34px; font-weight: 900; letter-spacing: 0.5px">Sound Island</div>
<div style="display: flex; align-items: center; gap: 16px">
<div style="display: flex; align-items: center; gap: 8px; background: #FFFFFF; border: 4px solid #2A2550; border-radius: 28px; padding: 8px 18px; box-shadow: 0 6px 0 #2A2550; font-size: 26px; font-weight: 900">
<svg width="30" height="30" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 3 L25 14 L37 15.5 L28 23.5 L30.5 35.5 L20 29.5 L9.5 35.5 L12 23.5 L3 15.5 L15 14 Z" fill="#FFD447" stroke="#2A2550" stroke-width="3" stroke-linejoin="round"/></svg>
<span>27</span>
</div>
<button aria-label="Grown-ups: press and hold for settings" style="width: 48px; height: 48px; border-radius: 24px; background: rgba(255,255,255,0.55); border: 0; display: flex; align-items: center; justify-content: center; padding: 0">
<svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5" fill="none" stroke="#2A2550" stroke-width="2"/><path d="M12 2.5 v3 M12 18.5 v3 M2.5 12 h3 M18.5 12 h3 M5.3 5.3 l2.1 2.1 M16.6 16.6 l2.1 2.1 M5.3 18.7 l2.1 -2.1 M16.6 7.4 l2.1 -2.1" stroke="#2A2550" stroke-width="2" stroke-linecap="round"/></svg>
</button>
</div>
</div>

<nav aria-label="Main" style="position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); display: flex; gap: 16px; background: #FFFFFF; border: 4px solid #2A2550; border-radius: 40px; padding: 12px; box-shadow: 0 8px 0 #2A2550">
<button aria-current="page" style="width: 176px; height: 88px; border-radius: 30px; background: #7B5CFF; border: 4px solid #2A2550; box-shadow: 0 6px 0 #5A3FD9; display: flex; align-items: center; justify-content: center; gap: 10px; color: #FFFFFF; font-size: 24px; font-weight: 900">
<svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6 L9 3 L15 6 L21 3 V18 L15 21 L9 18 L3 21 Z M9 3 V18 M15 6 V21" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linejoin="round"/></svg>Map</button>
<button style="width: 176px; height: 88px; border-radius: 30px; background: #FFFFFF; border: 4px solid #2A2550; box-shadow: 0 6px 0 #2A2550; display: flex; align-items: center; justify-content: center; gap: 10px; color: #2A2550; font-size: 24px; font-weight: 900">
<svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18 V5 L20 3 V16" fill="none" stroke="#2A2550" stroke-width="2.2" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="3" fill="#FF5A5F" stroke="#2A2550" stroke-width="2"/><circle cx="17.5" cy="16" r="3" fill="#4D8DFF" stroke="#2A2550" stroke-width="2"/></svg>Studio</button>
<button style="width: 176px; height: 88px; border-radius: 30px; background: #FFFFFF; border: 4px solid #2A2550; box-shadow: 0 6px 0 #2A2550; display: flex; align-items: center; justify-content: center; gap: 10px; color: #2A2550; font-size: 24px; font-weight: 900">
<svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" fill="#FFD23F" stroke="#2A2550" stroke-width="2"/><path d="M12 7 l1.6 3.3 3.6 .5 -2.6 2.5 .6 3.6 -3.2 -1.7 -3.2 1.7 .6 -3.6 -2.6 -2.5 3.6 -.5 Z" fill="#FFFFFF" stroke="#2A2550" stroke-width="1.5" stroke-linejoin="round"/></svg>Stickers</button>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"ocean":{"editor":"color","default":"#8EDBE8","options":["#8EDBE8","#A7D8FF","#B8F0D8"]},"$preview":{"width":1194,"height":834}}'>
class Component extends DCLogic {
  renderVals() {
    const E = {
      drum: 'M12 20 a18 6 0 1 0 36 0 a18 6 0 1 0 -36 0 M12 20 v16 a18 6 0 0 0 36 0 v-16',
      peaks: 'M6 44 L22 16 L32 30 L40 20 L54 44 Z',
      palm: 'M30 48 V24 M30 24 C22 16 14 16 8 20 M30 24 C38 16 46 16 52 20 M30 24 C26 14 28 8 32 4',
      anchor: 'M30 12 v34 M20 20 h20 M14 32 c2 10 10 14 16 14 c6 0 14 -4 16 -14 M30 4 a4 4 0 1 0 0.1 0',
      cave: 'M8 46 C8 22 18 10 30 10 C42 10 52 22 52 46 M20 46 C20 32 24 26 30 26 C36 26 40 32 40 46',
      volcano: 'M6 46 L22 18 H38 L54 46 Z M26 12 c0 -4 4 -4 4 -8 M34 12 c0 -4 4 -4 4 -8',
      sliders: 'M16 8 v38 M30 8 v38 M44 8 v38 M10 32 h12 M24 18 h12 M38 38 h12'
    };
    const raw = [
      { name: 'Beat Beach', x: 40, y: 440, fill: '#FF9A3C', emblem: E.drum, stars: 3 },
      { name: 'Pitch Peaks', x: 230, y: 180, fill: '#22C3C9', emblem: E.peaks, stars: 3 },
      { name: 'Melody Jungle', x: 430, y: 430, fill: '#3DD68C', emblem: E.palm, stars: 2 },
      { name: 'Harmony Harbor', x: 620, y: 160, fill: '#4D8DFF', emblem: E.anchor, stars: 0 },
      { name: 'Bass Caves', x: 810, y: 430, fill: '#C7CFDD', emblem: E.cave, stars: 0, locked: true },
      { name: 'Song Volcano', x: 990, y: 170, fill: '#C7CFDD', emblem: E.volcano, stars: 0, locked: true },
      { name: 'Mix Lab', x: 1110, y: 470, fill: '#C7CFDD', emblem: E.sliders, stars: 0, locked: true }
    ];
    const islands = raw.map((i) => ({
      ...i,
      locked: !!i.locked,
      aria: i.name + (i.locked ? ', locked' : ', ' + i.stars + ' of 3 stars'),
      pos: 'position: absolute; left: ' + i.x + 'px; top: ' + i.y + 'px; width: 190px; background: none; border: 0; padding: 0; display: flex; flex-direction: column; align-items: center; color: #2A2550;' + (i.locked ? ' opacity: 0.8;' : ''),
      stars: [0, 1, 2].map((k) => ({ fill: k < i.stars ? '#FFD447' : '#FFFFFF' }))
    }));
    return { islands, ocean: this.props.ocean ?? '#8EDBE8' };
  }
}
</script>
</body>
</html>
