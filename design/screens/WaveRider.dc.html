<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wave Rider game</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5A3FD9}a:hover{color:#2A2550}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 1194px; height: 834px; position: relative; overflow: hidden; background: #FFF6E9; font-family: 'Nunito', ui-rounded, system-ui, sans-serif; color: #2A2550">

<svg width="1194" height="300" viewBox="0 0 1194 300" aria-hidden="true" style="position: absolute; left: 0; top: 0">
<circle cx="1040" cy="210" r="56" fill="#FFD447" opacity="0.55"/>
<g fill="#FFFFFF" stroke="#2A2550" stroke-width="3" opacity="0.9">
<path d="M120 200 a22 22 0 0 1 40 -8 a18 18 0 0 1 30 14 h-74 a14 14 0 0 1 4 -6 Z"/>
<path d="M640 150 a22 22 0 0 1 40 -8 a18 18 0 0 1 30 14 h-74 a14 14 0 0 1 4 -6 Z"/>
</g>
</svg>

<div style="position: absolute; left: 32px; right: 32px; top: 24px; display: flex; align-items: center; justify-content: space-between">
<button aria-label="Pause" style="width: 76px; height: 76px; border-radius: 38px; background: #FFFFFF; border: 4px solid #2A2550; box-shadow: 0 6px 0 #2A2550; display: flex; align-items: center; justify-content: center; padding: 0">
<svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="5" height="16" rx="2" fill="#2A2550"/><rect x="14" y="4" width="5" height="16" rx="2" fill="#2A2550"/></svg>
</button>
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
<div style="font-size: 30px; font-weight: 900">Wave Rider</div>
<div role="img" aria-label="Round 4 of 8" style="display: flex; gap: 10px">
<sc-for list="{{dots}}" as="d" hint-placeholder-count="8"><span style="{{d.style}}"></span></sc-for>
</div>
</div>
<div style="width: 76px"></div>
</div>

<div style="position: absolute; left: 690px; top: 130px; display: flex; align-items: center; gap: 12px">
<div style="background: #FFFFFF; border: 3px solid #2A2550; border-radius: 22px 22px 6px 22px; padding: 12px 18px; font-size: 22px; font-weight: 800; box-shadow: 0 5px 0 #2A2550; max-width: 300px">Tap when a shell reaches the ring!</div>
<button aria-label="Hear the instructions again" style="width: 64px; height: 64px; border-radius: 32px; background: #7B5CFF; border: 4px solid #2A2550; box-shadow: 0 5px 0 #5A3FD9; display: flex; align-items: center; justify-content: center; padding: 0">
<svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9 h4 l5 -4 v14 l-5 -4 h-4 Z" fill="#FFFFFF"/><path d="M16 8.5 a5 5 0 0 1 0 7 M18.5 6 a8.5 8.5 0 0 1 0 12" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/></svg>
</button>
</div>

<div style="position: absolute; left: 0; top: 268px; width: 1194px; display: flex">
<sc-for list="{{beats}}" as="b" hint-placeholder-count="5"><span style="{{b.style}}">{{b.n}}</span></sc-for>
</div>

<svg width="1194" height="250" viewBox="0 0 1194 250" aria-hidden="true" style="position: absolute; left: 0; top: 300px">
<path d="M0 30 q60 -30 120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 V250 H0 Z" fill="#8EDBE8"/>
<path d="M0 30 q60 -30 120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
<path d="M0 30 q60 -30 120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0" fill="none" stroke="#2A2550" stroke-width="3" opacity="0.25" transform="translate(0 6)"/>
<path d="M0 205 H1194" stroke="#6CC9D9" stroke-width="40"/>
<line x1="358" y1="20" x2="358" y2="236" stroke="#2A2550" stroke-width="4" stroke-dasharray="4 10" stroke-linecap="round"/>
<circle cx="358" cy="120" r="58" fill="none" stroke="#FFD447" stroke-width="10"/>
<circle cx="358" cy="120" r="58" fill="none" stroke="#2A2550" stroke-width="3"/>
<circle cx="358" cy="120" r="74" fill="none" stroke="#FFD447" stroke-width="4" opacity="0.6"/>

<g stroke="#2A2550" stroke-width="4">
<rect x="303" y="86" width="110" height="68" rx="34" fill="#FF9A3C"/>
<path d="M330 120 q12 -18 24 0 q12 18 24 0" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
<circle cx="538" cy="120" r="32" fill="#FFD23F"/>
<circle cx="628" cy="120" r="32" fill="#FFD23F"/>
<rect x="843" y="86" width="110" height="68" rx="34" fill="#FF9A3C"/>
<path d="M870 120 q12 -18 24 0 q12 18 24 0" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
<rect x="1023" y="86" width="110" height="68" rx="34" fill="#FF9A3C"/>
<path d="M1050 120 q12 -18 24 0 q12 18 24 0" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
</g>
<path d="M538 104 v18 M628 104 v18" stroke="#2A2550" stroke-width="4" stroke-linecap="round"/>
<circle cx="718" cy="120" r="32" fill="none" stroke="#2A2550" stroke-width="4" stroke-dasharray="6 8"/>
<text x="718" y="128" text-anchor="middle" font-family="Nunito, ui-rounded, sans-serif" font-size="22" font-weight="900" fill="#2A2550">shh</text>
</svg>

<div style="position: absolute; left: 300px; top: 196px; width: 116px; height: 104px">
<svg width="116" height="104" viewBox="0 0 116 104" role="img" aria-label="Bop surfing">
<ellipse cx="58" cy="92" rx="56" ry="10" fill="#FF5A5F" stroke="#2A2550" stroke-width="4"/>
<g transform="translate(22 0) scale(0.6)">
<rect x="12" y="24" width="96" height="86" rx="40" fill="#5A3FD9" stroke="#2A2550" stroke-width="6"/>
<rect x="12" y="18" width="96" height="84" rx="40" fill="#7B5CFF" stroke="#2A2550" stroke-width="6"/>
<path d="M30 48 q12 -12 24 0 M66 48 q12 -12 24 0" fill="none" stroke="#2A2550" stroke-width="6" stroke-linecap="round"/>
<circle cx="60" cy="76" r="16" fill="#2A2550"/><circle cx="60" cy="76" r="10" fill="#4B3FA0"/><circle cx="60" cy="76" r="4" fill="#A99BFF"/>
</g>
</svg>
</div>

<div style="position: absolute; left: 148px; top: 210px; display: flex; flex-direction: column; align-items: center; gap: 6px">
<div style="background: #2ECC8F; color: #2A2550; border: 4px solid #2A2550; border-radius: 24px; padding: 8px 20px; font-size: 30px; font-weight: 900; box-shadow: 0 5px 0 #2A2550; transform: rotate(-6deg)">Great!</div>
</div>

<button style="position: absolute; left: 32px; right: 32px; bottom: 32px; height: 228px; border-radius: 48px; background: #EDE7FF; border: 5px dashed #7B5CFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: #2A2550; padding: 0">
<svg width="72" height="72" viewBox="0 0 48 48" aria-hidden="true"><path d="M18 26 V9 a4 4 0 0 1 8 0 V22 l10 2.5 a5 5 0 0 1 3.8 5.6 L38 40 a5 5 0 0 1 -5 4 H22 a5 5 0 0 1 -4 -2 L10 31 a3.5 3.5 0 0 1 5 -5 Z" fill="#FFFFFF" stroke="#2A2550" stroke-width="3" stroke-linejoin="round"/><path d="M10 6 l-3 -3 M30 6 l3 -3" stroke="#7B5CFF" stroke-width="3" stroke-linecap="round"/></svg>
<span style="font-size: 40px; font-weight: 900">Tap here on the beat!</span>
</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1194,"height":834}}'>
class Component extends DCLogic {
  renderVals() {
    const dots = [0, 1, 2, 3, 4, 5, 6, 7].map((i) => {
      const base = 'display: block; width: 20px; height: 20px; border-radius: 10px; border: 3px solid #2A2550;';
      if (i < 3) return { style: base + ' background: #2ECC8F;' };
      if (i === 3) return { style: base + ' background: #7B5CFF; box-shadow: 0 0 0 4px #D9CFFF;' };
      return { style: base + ' background: #FFFFFF;' };
    });
    const beats = ['1', '2', '3', '4', '1'].map((n, i) => ({
      n,
      style: 'position: absolute; left: ' + (358 + i * 180 - 20) + 'px; width: 40px; text-align: center; font-size: 22px; font-weight: 900; color: #6E6A93'
    }));
    return { dots, beats };
  }
}
</script>
</body>
</html>
