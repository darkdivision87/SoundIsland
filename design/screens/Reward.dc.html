<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reward and unlock</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#FFD447}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 1194px; height: 834px; position: relative; overflow: hidden; background: #6A4CF0; font-family: 'Nunito', ui-rounded, system-ui, sans-serif; color: #2A2550">

<svg width="1194" height="834" viewBox="0 0 1194 834" aria-hidden="true" style="position: absolute; left: 0; top: 0">
<g opacity="0.16" fill="#FFFFFF">
<circle cx="597" cy="360" r="420"/>
</g>
<sc-for list="{{confetti}}" as="c" hint-placeholder-count="14">
<path d="{{c.d}}" fill="{{c.fill}}" stroke="#2A2550" stroke-width="2.5" stroke-linejoin="round" transform="{{c.t}}"/>
</sc-for>
</svg>

<div style="position: absolute; left: 32px; top: 24px">
<button aria-label="Back to island" style="width: 76px; height: 76px; border-radius: 38px; background: #FFFFFF; border: 4px solid #2A2550; box-shadow: 0 6px 0 #2A2550; display: flex; align-items: center; justify-content: center; padding: 0">
<svg width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4 L7 12 L15 20" fill="none" stroke="#2A2550" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
</button>
</div>

<div style="position: absolute; left: 50%; top: 52px; transform: translateX(-50%); width: 660px; display: flex; flex-direction: column; align-items: center; gap: 0">
<div style="display: flex; align-items: flex-end; gap: 12px; height: 132px">
<svg width="104" height="104" viewBox="0 0 40 40" role="img" aria-label="Star 1 earned" style="transform: rotate(-12deg)"><path d="M20 3 L25 14 L37 15.5 L28 23.5 L30.5 35.5 L20 29.5 L9.5 35.5 L12 23.5 L3 15.5 L15 14 Z" fill="#FFD447" stroke="#2A2550" stroke-width="2.2" stroke-linejoin="round"/></svg>
<svg width="132" height="132" viewBox="0 0 40 40" role="img" aria-label="Star 2 earned"><path d="M20 3 L25 14 L37 15.5 L28 23.5 L30.5 35.5 L20 29.5 L9.5 35.5 L12 23.5 L3 15.5 L15 14 Z" fill="#FFD447" stroke="#2A2550" stroke-width="2" stroke-linejoin="round"/></svg>
<svg width="104" height="104" viewBox="0 0 40 40" role="img" aria-label="Star 3 earned" style="transform: rotate(12deg)"><path d="M20 3 L25 14 L37 15.5 L28 23.5 L30.5 35.5 L20 29.5 L9.5 35.5 L12 23.5 L3 15.5 L15 14 Z" fill="#FFD447" stroke="#2A2550" stroke-width="2.2" stroke-linejoin="round"/></svg>
</div>
<h1 style="margin: 18px 0 0; font-size: 48px; line-height: 52px; font-weight: 900; color: #FFFFFF; text-align: center">You're a Chord Chef!</h1>
<p style="margin: 8px 0 0; font-size: 24px; font-weight: 800; color: #FFFFFF; text-align: center">8 chords cooked. Every one sounded yummy.</p>

<div style="margin-top: 28px; width: 620px; background: #FFFFFF; border: 5px solid #2A2550; border-radius: 40px; box-shadow: 0 10px 0 #2A2550; padding: 26px 28px; display: flex; flex-direction: column; gap: 18px; box-sizing: border-box">
<div style="display: flex; align-items: center; gap: 10px">
<span style="background: #FFD447; border: 3px solid #2A2550; border-radius: 14px; padding: 4px 12px; font-size: 18px; font-weight: 900">New!</span>
<span style="font-size: 26px; font-weight: 900">Chord Pads are in your Studio</span>
</div>
<div style="display: flex; gap: 14px">
<sc-for list="{{chords}}" as="ch" hint-placeholder-count="4">
<div style="{{ch.style}}">
<svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><path d="{{ch.face}}" fill="#FFFFFF" stroke="#2A2550" stroke-width="2.5" stroke-linejoin="round"/><circle cx="16" cy="20" r="2" fill="#2A2550"/><circle cx="24" cy="20" r="2" fill="#2A2550"/></svg>
<span style="font-size: 22px; font-weight: 900; color: #2A2550">{{ch.name}}</span>
</div>
</sc-for>
</div>
</div>

<div style="margin-top: 30px; display: flex; gap: 20px">
<button style="height: 92px; padding: 0 34px; border-radius: 34px; background: #2ECC8F; border: 5px solid #2A2550; box-shadow: 0 7px 0 #1E9A6A; display: flex; align-items: center; gap: 12px; color: #2A2550; font-size: 28px; font-weight: 900">
<svg width="36" height="36" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18 V5 L20 3 V16" fill="none" stroke="#2A2550" stroke-width="2.4" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="3" fill="#FFFFFF" stroke="#2A2550" stroke-width="2"/><circle cx="17.5" cy="16" r="3" fill="#FFFFFF" stroke="#2A2550" stroke-width="2"/></svg>Add to my song</button>
<button style="height: 92px; padding: 0 30px; border-radius: 34px; background: #FFFFFF; border: 5px solid #2A2550; box-shadow: 0 7px 0 #2A2550; display: flex; align-items: center; gap: 12px; color: #2A2550; font-size: 28px; font-weight: 900">
<svg width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12 a8 8 0 1 0 2.5 -5.8 M4 4 v5 h5" fill="none" stroke="#2A2550" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Play again</button>
</div>
</div>

<div style="position: absolute; left: 70px; bottom: 60px">
<svg width="190" height="190" viewBox="0 0 120 120" role="img" aria-label="Bop cheering">
<path d="M16 50 L2 26 M104 50 L118 26" stroke="#2A2550" stroke-width="7" stroke-linecap="round"/>
<circle cx="2" cy="24" r="7" fill="#FFD447" stroke="#2A2550" stroke-width="3"/><circle cx="118" cy="24" r="7" fill="#FFD447" stroke="#2A2550" stroke-width="3"/>
<ellipse cx="60" cy="114" rx="36" ry="5" fill="#2A2550" opacity="0.25"/>
<rect x="12" y="24" width="96" height="86" rx="40" fill="#5A3FD9" stroke="#2A2550" stroke-width="4"/>
<rect x="12" y="18" width="96" height="84" rx="40" fill="#9D85FF" stroke="#2A2550" stroke-width="4"/>
<path d="M32 48 q10 -12 20 0 M68 48 q10 -12 20 0" fill="none" stroke="#2A2550" stroke-width="4.5" stroke-linecap="round"/>
<circle cx="27" cy="64" r="6" fill="#FF8FB1"/><circle cx="93" cy="64" r="6" fill="#FF8FB1"/>
<circle cx="60" cy="76" r="18" fill="#2A2550"/><circle cx="60" cy="76" r="12" fill="#4B3FA0"/><circle cx="60" cy="76" r="5" fill="#A99BFF"/>
</svg>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1194,"height":834}}'>
class Component extends DCLogic {
  renderVals() {
    const S = {
      circle: 'M20 6 a14 14 0 1 0 0.01 0 Z',
      triangle: 'M20 5 L35 32 L5 32 Z',
      square: 'M7 7 H33 V33 H7 Z',
      diamond: 'M20 3 L37 20 L20 37 L3 20 Z',
      hexagon: 'M20 3 L35 11.5 L35 28.5 L20 37 L5 28.5 L5 11.5 Z',
      star: 'M20 3 L25 14 L37 15.5 L28 23.5 L30.5 35.5 L20 29.5 L9.5 35.5 L12 23.5 L3 15.5 L15 14 Z',
      heart: 'M20 35 C8 27 3 20 3 13.5 C3 8.5 7 5 11.5 5 C15 5 18 7 20 10 C22 7 25 5 28.5 5 C33 5 37 8.5 37 13.5 C37 20 32 27 20 35 Z'
    };
    const spots = [
      [120, 130, 'circle', '#FF5A5F', -10], [250, 60, 'triangle', '#FFD23F', 20], [960, 90, 'diamond', '#3DD68C', 15],
      [1060, 220, 'heart', '#FF8FB1', -18], [880, 300, 'star', '#FFD447', 30], [200, 330, 'hexagon', '#22C3C9', 10],
      [1080, 520, 'square', '#FF9A3C', -20], [960, 700, 'circle', '#4D8DFF', 0], [330, 720, 'diamond', '#FFD23F', -25],
      [1120, 380, 'triangle', '#3DD68C', 40], [80, 420, 'star', '#A66BFF', -30], [820, 620, 'heart', '#FF5A5F', 12],
      [380, 200, 'square', '#FFFFFF', 18], [800, 200, 'circle', '#FF9A3C', 0]
    ];
    const confetti = spots.map(([x, y, s, f, r]) => ({ d: S[s], fill: f, t: 'translate(' + x + ' ' + y + ') rotate(' + r + ' 20 20) scale(0.8)' }));
    const sun = 'M20 8 a12 12 0 1 0 0.01 0 Z';
    const moon = 'M26 6 a14 14 0 1 0 8 22 a11 11 0 1 1 -8 -22 Z';
    const chords = [
      { name: 'I', color: '#FF5A5F', lip: '#C9363B', face: sun },
      { name: 'IV', color: '#3DD68C', lip: '#21A867', face: sun },
      { name: 'V', color: '#22C3C9', lip: '#13979C', face: sun },
      { name: 'vi', color: '#4D8DFF', lip: '#2F68D1', face: moon }
    ].map((c) => ({ ...c, style: 'flex: 1; height: 112px; border-radius: 26px; background: ' + c.color + '; border: 4px solid #2A2550; box-shadow: 0 6px 0 ' + c.lip + '; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px' }));
    return { confetti, chords };
  }
}
</script>
</body>
</html>
